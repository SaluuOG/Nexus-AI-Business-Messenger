name: Validate Nexus iOS

on:
  pull_request:
    branches: ["main"]
    paths:
      - "ios/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package*.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "tests/ios-package.test.mjs"
      - ".github/scripts/verify-ios-package.mjs"
      - ".github/workflows/validate-ios.yml"
  push:
    branches: ["main"]
    paths:
      - "ios/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package*.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "tests/ios-package.test.mjs"
      - ".github/scripts/verify-ios-package.mjs"
      - ".github/workflows/validate-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Unsigned iOS release build
    runs-on: macos-26
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify Xcode and public configuration
        run: |
          xcodebuild -version
          node .github/scripts/verify-ios-package.mjs --config-only
      - name: Install dependencies
        run: npm ci
      - name: Test iOS package safeguards
        run: node --test tests/ios-package.test.mjs
      - name: Build and synchronize iOS web assets
        run: npm run build:ios
      - name: Check bundled assets before compilation
        run: node .github/scripts/verify-ios-package.mjs ios/App/App
      - name: Compile iPhone release without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/nexus-ios-build" \
            -resultBundlePath "$RUNNER_TEMP/nexus-ios-result.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/nexus-ios-build.log"
      - name: Verify compiled application and SDK privacy manifests
        run: |
          task_app="$RUNNER_TEMP/nexus-ios-build/Build/Products/Release-iphoneos/App.app"
          node .github/scripts/verify-ios-package.mjs "$task_app" --compiled
          plutil -lint "$task_app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$task_app/Info.plist"
      - name: Preserve Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            ${{ runner.temp }}/nexus-ios-build.log
            ${{ runner.temp }}/nexus-ios-result.xcresult
          if-no-files-found: ignore
          retention-days: 7
