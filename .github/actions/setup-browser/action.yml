name: Set up Nexus browser checks
description: Install the isolated, pinned browser test runtime
runs:
  using: composite
  steps:
    - shell: bash
      run: npm install --prefix "$RUNNER_TEMP/nexus-browser" --no-save --package-lock=false playwright@1.55.1
    - shell: bash
      run: node "$RUNNER_TEMP/nexus-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit
